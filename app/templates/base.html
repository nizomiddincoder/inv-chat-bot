<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventor admin — Markaz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%235B6CF0'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5B6CF0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Markaz">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <script>
    /* Theme before first paint: stored choice wins, else system preference. */
    (function () {
      try {
        var theme = localStorage.getItem("markaz_theme");
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============ Design tokens (light default + dark overrides) ============ */
    :root {
      --primary: #5B6CF0;
      --primary-2: #7C89F5;
      --primary-deep: #4350C9;
      --bg: #F4F5FD;
      --surface: #FFFFFF;
      --text: #1E2235;
      --muted: #6B7180;
      --faint: #9AA0B0;
      --border: #E6E8F4;
      --tint: #EEF0FD;
      --hover: #F7F8FE;
      --row-hover: #FAFBFE;
      --green: #22C55E;
      --orange: #F59E0B;
      --red: #EF4444;
      --teal: #14B8A6;
      --ok-bg: #E9F9EF;   --ok-border: #B7E7C7;   --ok-text: #15803D;
      --warn-bg: #FEF3E2; --warn-text: #B45309;
      --mut-bg: #F1F3F9;  --mut-text: #6B7180;
      --danger-bg: #FDEBEC; --danger-text: #B91C1C;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --sh-sm: 0 1px 2px rgba(30,34,53,.05), 0 2px 8px rgba(91,108,240,.06);
      --sh-md: 0 4px 16px rgba(91,108,240,.10), 0 2px 6px rgba(30,34,53,.05);
      --topbar-h: 54px;
    }
    html.dark {
      --bg: #10121F;
      --surface: #191C2C;
      --text: #E8EAF6;
      --muted: #A2A8C0;
      --faint: #707690;
      --border: #2B2F47;
      --tint: #232849;
      --hover: #20243A;
      --row-hover: #1E2236;
      --primary-2: #8A96F7;
      --green: #4ADE80;
      --orange: #F5B04C;
      --red: #F87171;
      --teal: #2DD4BF;
      --ok-bg: #12301F;   --ok-border: #1F5A38;   --ok-text: #7BE0A2;
      --warn-bg: #38290E; --warn-text: #F5C97B;
      --mut-bg: #232740;  --mut-text: #A2A8C0;
      --danger-bg: #3A1518; --danger-text: #F58A8A;
      --sh-sm: 0 1px 2px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25);
      --sh-md: 0 4px 16px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ Icons ============ */
    .i { width: 16px; height: 16px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }

    /* ============ Shell: sidebar + main ============ */
    .shell { display: flex; min-height: 100vh; }
    .side {
      width: 216px; flex: 0 0 auto;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex; flex-direction: column; gap: 4px;
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto;
    }
    .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary); color: #fff;
      font-weight: 700; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-name { font-size: 16px; font-weight: 600; }
    .side nav { display: flex; flex-direction: column; gap: 3px; }
    .side nav a, .side nav summary {
      position: relative;
      display: flex; align-items: center; gap: 9px;
      color: var(--muted); text-decoration: none;
      font-size: 14px; font-weight: 500;
      padding: 9px 12px; border-radius: var(--r-sm);
      white-space: nowrap;
      min-height: 38px;
    }
    .side nav a .lbl, .side nav summary .lbl {
      min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    .side nav a:hover, .side nav summary:hover { color: var(--text); background: var(--hover); }
    .side nav a.active { color: var(--primary); background: var(--tint); }
    .side nav a.active::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
      width: 3px; border-radius: 2px; background: var(--primary);
    }
    /* Boshqaruv: collapsible group, inner items indented with a guide line */
    .side details.nav-group summary { list-style: none; cursor: pointer; user-select: none; }
    .side details.nav-group summary::-webkit-details-marker { display: none; }
    .side details.nav-group summary::after {
      content: ""; display: inline-block; margin-left: auto;
      border: 4px solid transparent; border-top-color: var(--faint);
      transition: transform .15s;
    }
    .side details.nav-group[open] summary::after { transform: rotate(180deg); }
    .side details.nav-group .inner {
      display: flex; flex-direction: column; gap: 2px;
      margin: 2px 0 4px 18px; padding-left: 8px;
      border-left: 2px solid var(--border);
    }
    .side details.nav-group .inner a { font-size: 13.5px; padding: 8px 10px; min-height: 36px; }
    .side details.nav-group .inner a.active::before { display: none; }
    .side details.nav-group .inner a.active { background: var(--tint); }
    .side-foot {
      margin-top: auto; padding: 14px 8px 2px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .side-foot a.logout {
      display: flex; align-items: center; gap: 9px;
      color: var(--muted); font-size: 13.5px; font-weight: 500; text-decoration: none;
      padding: 9px 12px; border-radius: var(--r-sm);
    }
    .side-foot a.logout:hover { color: var(--red); background: var(--hover); }
    .side-foot .foot-note { color: var(--faint); font-size: 11.5px; }
    .theme-btn {
      display: flex; align-items: center; gap: 9px;
      width: 100%;
      color: var(--muted); background: var(--hover);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      font-family: inherit; font-size: 13.5px; font-weight: 500;
      padding: 8px 12px; min-height: 38px; cursor: pointer;
    }
    .theme-btn:hover { color: var(--text); }
    html.dark .icon-moon { display: none; }
    html:not(.dark) .icon-sun { display: none; }
    .theme-dark-label { display: none; }
    html.dark .theme-light-label { display: none; }
    html.dark .theme-dark-label { display: inline; }

    main {
      flex: 1 1 auto; min-width: 0;
      padding: 24px 28px 40px;
      max-width: 1220px;
    }

    /* ============ Mobile top bar + off-canvas sidebar ============ */
    .topbar {
      display: none;
      position: sticky; top: 0; z-index: 40;
      background: var(--surface); border-bottom: 1px solid var(--border);
      height: var(--topbar-h);
      align-items: center; gap: 12px; padding: 0 14px;
    }
    .topbar .logo-mark { width: 30px; height: 30px; font-size: 13px; }
    .topbar .brand { font-weight: 600; }
    .topbar .spacer { flex: 1; }
    .hamburger, .theme-btn-sm {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: var(--r-sm);
      background: var(--hover); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer;
    }
    .nav-backdrop {
      position: fixed; inset: 0; z-index: 45;
      background: rgba(10, 12, 24, .5);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    body.nav-open .nav-backdrop { opacity: 1; pointer-events: auto; }

    @media (max-width: 900px) {
      .topbar { display: flex; }
      .side {
        position: fixed; left: 0; top: 0; bottom: 0; height: 100vh;
        z-index: 50; transform: translateX(-105%);
        transition: transform .2s ease;
        box-shadow: var(--sh-md);
      }
      body.nav-open .side { transform: none; }
      .shell { flex-direction: column; }
      .logo { padding-bottom: 12px; }
      .side nav a.active::before { display: none; }
      main { padding: 16px 14px 32px; }
    }

    /* ============ Typography ============ */
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -.2px; margin: 0 0 18px; }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    .page-sub { color: var(--muted); font-size: 13px; margin: -12px 0 18px; }

    /* ============ Cards ============ */
    .card {
      background: var(--surface);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .card h2 { margin-top: 0; }

    /* ============ Flash ============ */
    .flash {
      background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok-text);
      padding: 10px 14px; border-radius: var(--r-md); margin-bottom: 18px;
      font-weight: 500;
    }

    /* ============ Forms ============ */
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13.5px; }
    input, select, textarea, button {
      font-family: inherit; font-size: 14px;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      background: var(--surface); color: var(--text);
      padding: 0 11px; height: 36px;
    }
    input[type="checkbox"] { height: auto; width: 16px; accent-color: var(--primary); }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--primary-2); outline-offset: 0; border-color: var(--primary);
    }
    textarea { width: 100%; min-height: 90px; resize: vertical; padding: 9px 11px; height: auto; }

    /* ============ Buttons: one system on every page ============ */
    button, .btn {
      background: var(--primary); color: #fff; border: none;
      font-weight: 600; cursor: pointer;
      height: 36px; padding: 0 16px; border-radius: var(--r-sm);
      display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap; text-decoration: none; font-size: 14px;
    }
    button:hover, .btn:hover { background: var(--primary-deep); }
    button.danger { background: var(--red); }
    button.danger:hover { background: #DC2626; }
    button.outline, .btn.outline {
      background: var(--surface); color: var(--primary);
      border: 1px solid var(--primary-2);
    }
    button.outline:hover, .btn.outline:hover { background: var(--tint); }
    button.small { padding: 0 12px; font-size: 13px; }

    /* horizontal button groups: never stack, min 8px apart */
    .actions { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filters {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-sm);
      padding: 14px 16px; margin-bottom: 18px;
    }

    /* ============ Tables ============ */
    .table-wrap {
      background: var(--surface); border-radius: var(--r-lg);
      box-shadow: var(--sh-sm); overflow-x: auto; padding: 6px 6px 2px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 880px; }
    th {
      text-align: left; white-space: nowrap;
      font-size: 11px; font-weight: 500; letter-spacing: .4px; text-transform: uppercase;
      color: var(--faint); padding: 12px 9px 8px;
    }
    td { padding: 11px 9px; border-top: 1px solid var(--border); vertical-align: middle; overflow-wrap: break-word; word-break: normal; }
    tr:hover td { background: var(--row-hover); }
    .nowrap { white-space: nowrap; }
    td a { color: var(--primary); text-decoration: none; font-weight: 500; }
    td a:hover { text-decoration: underline; }

    /* ============ Misc ============ */
    .hint { color: var(--muted); font-size: 13px; font-weight: 400; margin: 6px 0; }
    .muted { color: var(--muted); }
    .btn {
      display: inline-block; padding: 8px 16px;
      background: var(--primary); color: #fff;
      text-decoration: none; border-radius: var(--r-sm);
      font-size: 14px; font-weight: 600;
    }
    code {
      background: var(--tint); color: var(--primary-2);
      padding: 2px 6px; border-radius: 6px; font-size: 12.5px;
    }

    /* Status dots (new | contacted | trial | enrolled | rejected) */
    .st-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .st-new { background: var(--primary); }
    .st-contacted { background: var(--orange); }
    .st-trial { background: var(--teal); }
    .st-enrolled { background: var(--green); }
    .st-rejected { background: var(--red); }
  </style>
</head>
<body>
  <div class="nav-backdrop" id="nav-backdrop"></div>

  <header class="topbar">
    <button class="hamburger" id="nav-toggle" type="button" aria-label="Menyu">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="logo-mark">M</div>
    <span class="brand">Markaz</span>
    <span class="spacer"></span>
    <button class="theme-btn-sm theme-toggle" type="button" aria-label="Tungi rejim">
      <svg class="i icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg class="i icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="shell">
    <aside class="side" id="side">
      <div class="logo">
        <div class="logo-mark">M</div>
        <div class="logo-name">Markaz</div>
      </div>
      <nav>
        <a href="/admin/kanban" class="{{ 'active' if active == 'kanban' else '' }}">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
          <span class="lbl">Bugun</span>
        </a>
        <a href="/admin/leads" class="{{ 'active' if active == 'leads' else '' }}">
          <svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3.5 20c.6-3.4 2.8-5 5.5-5s4.9 1.6 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15c2.6.2 4.2 1.7 4.6 4.5"/></svg>
          <span class="lbl">Lidlar</span>
        </a>
        <a href="/admin/students" class="{{ 'active' if active == 'students' else '' }}">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 4 2.5 8.5 12 13l9.5-4.5L12 4z"/><path d="M6.5 10.8V15c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-4.2"/></svg>
          <span class="lbl">Talabalar</span>
        </a>
        <a href="/admin/debtors" class="{{ 'active' if active == 'debtors' else '' }}">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/></svg>
          <span class="lbl">Qarzdorlar</span>
        </a>
        <details class="nav-group" {% if active in ('courses', 'groups', 'teachers', 'employees', 'ai', 'settings', 'report', 'templates', 'audit', 'backups', 'errors') %}open{% endif %}>
          <summary>
            <svg class="i" viewBox="0 0 24 24"><path d="M4 8h10M4 16h7"/><circle cx="18" cy="8" r="2.5"/><circle cx="15" cy="16" r="2.5"/></svg>
            <span class="lbl">Boshqaruv</span>
          </summary>
          <div class="inner">
            <a href="/admin/report" class="{{ 'active' if active == 'report' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
              <span class="lbl">Hisobot</span>
            </a>
            <a href="/admin/courses" class="{{ 'active' if active == 'courses' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/></svg>
              <span class="lbl">Kurslar</span>
            </a>
            <a href="/admin/groups" class="{{ 'active' if active == 'groups' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
              <span class="lbl">Guruhlar</span>
            </a>
            <a href="/admin/teachers" class="{{ 'active' if active == 'teachers' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/></svg>
              <span class="lbl">O'qituvchilar</span>
            </a>
            <a href="/admin/employees" class="{{ 'active' if active == 'employees' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.5-1.6 1.6-2.4 3-2.4s2.5.8 3 2.4M15 9h4M15 12.5h4"/></svg>
              <span class="lbl">Xodimlar</span>
            </a>
            <a href="/admin/ai" class="{{ 'active' if active == 'ai' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/></svg>
              <span class="lbl">AI Javoblar</span>
            </a>
            <a href="/admin/templates" class="{{ 'active' if active == 'templates' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><path d="M4 5h16M4 5v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5M8 9h8M8 13h5"/></svg>
              <span class="lbl">Shablonlar</span>
            </a>
            <a href="/admin/backups" class="{{ 'active' if active == 'backups' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5V12c0 1.6 3.6 2.8 8 2.8s8-1.2 8-2.8V5.5M4 12v6.5c0 1.6 3.6 2.8 8 2.8s8-1.2 8-2.8V12"/></svg>
              <span class="lbl">Zaxira</span>
            </a>
            <a href="/admin/errors" class="{{ 'active' if active == 'errors' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17.2v.3"/></svg>
              <span class="lbl">Xatolar</span>
            </a>
            <a href="/admin/audit" class="{{ 'active' if active == 'audit' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M9 11h4M11 9v4"/></svg>
              <span class="lbl">Jurnal</span>
            </a>
            <a href="/admin/settings" class="{{ 'active' if active == 'settings' else '' }}">
              <svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg>
              <span class="lbl">Sozlamalar</span>
            </a>
          </div>
        </details>
      </nav>
      <div class="side-foot">
        <button class="theme-btn theme-toggle" type="button">
          <svg class="i icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          <svg class="i icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="theme-light-label">Tungi rejim</span>
          <span class="theme-dark-label">Kunduzgi rejim</span>
        </button>
        <a class="logout" href="/admin/logout">
          <svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Chiqish</span>
        </a>
        <div class="foot-note">Inventor Innovation Center</div>
      </div>
    </aside>
    <main>
      {% if saved %}<div class="flash">Saqlandi</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <style>
    #toast {
      position: fixed; bottom: 18px; right: 18px; z-index: 60;
      background: var(--primary); color: #fff;
      padding: 11px 18px; border-radius: var(--r-md);
      font-size: 14px; font-weight: 500; box-shadow: var(--sh-md);
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
  <script>
    function showToast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._hideTimer);
      t._hideTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
    }

    (function () {
      // --- PWA: register the offline service worker ---
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      }

      // --- theme toggle: html.dark + localStorage ("markaz_theme") ---
      function applyTheme(dark) {
        document.documentElement.classList.toggle("dark", dark);
        try { localStorage.setItem("markaz_theme", dark ? "dark" : "light"); } catch (e) {}
      }
      document.querySelectorAll(".theme-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyTheme(!document.documentElement.classList.contains("dark"));
        });
      });

      // --- remember the Boshqaruv group open/closed state ---
      var group = document.querySelector("details.nav-group");
      if (group) {
        try {
          var saved = localStorage.getItem("markaz_nav_open");
          if (saved === "1") group.open = true;
          else if (saved === "0") group.open = false;
        } catch (e) {}
        group.addEventListener("toggle", function () {
          try { localStorage.setItem("markaz_nav_open", group.open ? "1" : "0"); } catch (e) {}
        });
      }

      // --- mobile hamburger: off-canvas sidebar ---
      var body = document.body;
      var toggle = document.getElementById("nav-toggle");
      var backdrop = document.getElementById("nav-backdrop");
      function closeNav() { body.classList.remove("nav-open"); }
      if (toggle) {
        toggle.addEventListener("click", function () {
          body.classList.toggle("nav-open");
        });
      }
      if (backdrop) backdrop.addEventListener("click", closeNav);
      document.querySelectorAll(".side nav a").forEach(function (link) {
        link.addEventListener("click", closeNav);
      });
    })();
  </script>
</body>
</html>
